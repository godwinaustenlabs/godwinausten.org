<svg xmlns="http://www.w3.org/2000/svg" viewBox="542.8 71.9 984.7 1630.8" fill="none" role="presentation">
<!-- Godwin Austen Labs - one part of the logomark. Generated: npm run gen:chrome-mark -->
<defs>
  <g id="mark"><path transform="translate(962.3 991.7)" d="M0 0 C1.07215759 -0.00367584 2.14431519 -0.00735168 3.2489624 -0.01113892 C22.05372534 -0.04484179 40.48949861 1.2449535 59.0625 4.25 C60.72575317 4.51647339 60.72575317 4.51647339 62.42260742 4.78833008 C64.57947181 5.13782272 66.73569221 5.49132304 68.89111328 5.84960938 C71.14300003 6.222368 73.39629233 6.57581402 75.65234375 6.921875 C127.3035009 15.84179479 178.91933659 42.48020904 217.2265625 78.03515625 C219.42709446 80.07152154 221.66478703 82.04511853 223.9375 84 C230.39726752 89.63091751 236.14065614 95.79075631 241.6875 102.3125 C242.43902344 103.18648437 243.19054688 104.06046875 243.96484375 104.9609375 C292.51195963 162.17444215 317.96735946 235.8027439 317.875 310.5 C317.87506042 311.2601944 317.87512085 312.02038879 317.87518311 312.80361938 C317.86218831 324.34223884 317.42086174 335.71413624 315.95654297 347.171875 C315.70364346 349.18405552 315.49294209 351.20141174 315.28515625 353.21875 C313.2910763 371.60226799 309.72742067 389.83140031 303.6875 407.3125 C303.26269479 408.66273824 302.84225833 410.01435728 302.42578125 411.3671875 C289.19547026 453.74400959 266.5050156 492.51930565 236.6875 525.3125 C235.79683838 526.29573242 235.79683838 526.29573242 234.88818359 527.29882812 C228.46429455 534.36357617 222.05356089 541.21875871 214.6875 547.3125 C213.71039062 548.17746094 212.73328125 549.04242187 211.7265625 549.93359375 C186.80049956 571.96655093 157.05739781 589.83188422 125.87060547 601.49414062 C123.40664717 602.41778055 120.95628972 603.3741966 118.50390625 604.328125 C106.90773997 608.76479397 95.34077348 612.18455189 83.20166016 614.77441406 C80.7588103 615.29723802 78.32275978 615.84486006 75.88671875 616.3984375 C67.61558514 618.24760157 59.32355732 619.77079823 50.9375 621 C50.13505859 621.11939941 49.33261719 621.23879883 48.50585938 621.36181641 C33.02063173 623.51392668 17.49555324 623.49883434 1.89355469 623.49780273 C-1.77681262 623.49997884 -5.44687348 623.51816233 -9.1171875 623.53710938 C-57.20579623 623.65164316 -104.9945726 614.81517038 -148.3125 593.3125 C-149.76317871 592.60335449 -149.76317871 592.60335449 -151.24316406 591.87988281 C-166.38848462 584.43331458 -180.56756012 576.10267556 -194.3125 566.3125 C-195.42407471 565.52528564 -195.42407471 565.52528564 -196.55810547 564.72216797 C-205.53096429 558.32110884 -213.76179633 551.40940273 -221.7199707 543.79223633 C-223.51712565 542.12236723 -225.36939939 540.52793837 -227.23046875 538.9296875 C-231.26985064 535.41453315 -234.97749624 531.66684444 -238.625 527.75 C-239.27307617 527.05527588 -239.92115234 526.36055176 -240.58886719 525.64477539 C-246.07247237 519.69743323 -251.15682894 513.52276182 -256.00634766 507.05126953 C-257.32746411 505.29257956 -258.66865944 503.55056244 -260.01171875 501.80859375 C-283.7228362 470.68960619 -300.49707023 434.05466296 -310.3125 396.3125 C-310.6307373 395.12213135 -310.94897461 393.9317627 -311.27685547 392.70532227 C-332.15753469 313.32250769 -321.48707272 222.81018855 -280.65820312 151.41992188 C-274.14006679 140.2490606 -267.40174095 129.41685435 -259.3125 119.3125 C-258.45341866 118.19187164 -257.59677566 117.0693711 -256.7421875 115.9453125 C-250.37959177 107.62420162 -243.59193458 99.84137265 -236.3125 92.3125 C-235.68118164 91.65926758 -235.04986328 91.00603516 -234.39941406 90.33300781 C-226.41725087 82.11891736 -218.40125758 74.30180773 -209.3125 67.3125 C-208.36890625 66.55195312 -207.4253125 65.79140625 -206.453125 65.0078125 C-178.42741097 42.74373004 -144.15422115 23.83429626 -109.4375 14.75 C-108.67123291 14.54439453 -107.90496582 14.33878906 -107.11547852 14.12695312 C-105.56774004 13.71212518 -104.01933359 13.2997801 -102.47021484 12.89013672 C-100.54388306 12.37444301 -98.62486023 11.83162323 -96.70703125 11.28515625 C-64.81930336 2.31335484 -32.95379775 0.05418555 0 0 Z"/></g>

  <!--
    A mask, not a clipPath.

    clipPath only accepts shapes and uses *of* shapes; a use pointing at a group
    is not valid there, and the browser resolves it to an empty clip rather than
    complaining — so the face silently vanished and left an empty outline. A mask
    takes arbitrary content, including this group.
  -->
  <mask id="markMask" maskUnits="userSpaceOnUse"
    x="542.8" y="71.9" width="984.7" height="1630.8">
    <use href="#mark" fill="#ffffff"/>
  </mask>

  <!-- The film, repeating across the mark on a diagonal. -->
  <linearGradient id="film" gradientUnits="userSpaceOnUse" spreadMethod="repeat"
    x1="630.2" y1="159.3"
    x2="1001.4" y2="654.4"><stop offset="0" stop-color="#ffffff"/><stop offset="0.1" stop-color="#c6ff3e"/><stop offset="0.2" stop-color="#3f6b1f"/><stop offset="0.3" stop-color="#eafff0"/><stop offset="0.3" stop-color="#1f5f4a"/><stop offset="0.4" stop-color="#cfe4ff"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="0.6" stop-color="#e9c896"/><stop offset="0.7" stop-color="#c2624a"/><stop offset="0.8" stop-color="#5e2a24"/><stop offset="0.8" stop-color="#f3efe4"/><stop offset="0.9" stop-color="#9ee04a"/><stop offset="1" stop-color="#ffffff"/></linearGradient>

  <!--
    Swirl the film, then light it.

    The displacement scale is what separates "wavy stripes" from "poured oil":
    below about a tenth of the mark it reads as a wobble, and far above it the
    bands tear. The specular pass runs off the same noise, so the highlights sit
    where the surface actually curves rather than being sprinkled on.

    The filter region is a percentage of the *rect's* box, and that rect is
    identical in all three files — which is what keeps one part's swirl continuous
    with the next one's.
  -->
  <filter id="slick" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
    <!--
      The frequency is the whole effect and it is easy to get wrong by an order
      of magnitude. At one over the mark's height the field is nearly constant
      across the shape, every pixel displaces by the same amount, and the bands
      come out perfectly straight — a striped sticker. It wants a wavelength of
      roughly a fifth of the mark, so the swirl turns several times inside it.
    -->
    <feTurbulence type="fractalNoise" baseFrequency="0.00361 0.00254"
      numOctaves="4" seed="11" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="436.8"
      xChannelSelector="R" yChannelSelector="G" result="swirl"/>

    <feGaussianBlur in="noise" stdDeviation="17.5" result="bump"/>
    <feSpecularLighting in="bump" surfaceScale="87.4" specularConstant="1.6"
      specularExponent="18" lighting-color="#ffffff" result="spec">
      <feDistantLight azimuth="238" elevation="55"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="swirl" operator="in" result="specClipped"/>
    <feBlend in="swirl" in2="specClipped" mode="screen" result="lit"/>

    <!-- A broad sweep of sheen across the whole solid, so it reads as one form. -->
    <feGaussianBlur in="lit" stdDeviation="5.8"/>
  </filter>

</defs>

<!-- The face: the film, swirled and lit, cut to this part. -->
<g mask="url(#markMask)">
  <rect x="-267.2" y="-1384.1" width="2604.7" height="4542.9"
    fill="url(#film)" filter="url(#slick)"/>
</g>

<!--
  The silhouette, drawn.

  The film is anchored on white, which was free while the mark sat on an ink
  cell: the light bands were the highlights. On paper they are the *background*,
  and the shape dissolved into it at its edges — the mark read as a smudge of
  colour rather than as a mark. A hairline gives it back its outline, in the same
  ink and at the same weight as every rule on the site.
-->
<use href="#mark" fill="none" stroke="#0e0e0c" stroke-width="7.3" stroke-opacity="0.72"/>

</svg>
