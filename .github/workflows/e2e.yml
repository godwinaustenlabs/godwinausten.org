name: E2E

# Playwright drives a full OpenNext build + workerd preview, which is slow.
# It runs on demand and on pushes to main rather than on every commit.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  e2e:
    name: Playwright (workerd preview)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run cf:typegen
      - run: npm run test:e2e:install
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
